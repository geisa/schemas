syntax = "proto3";

import "geisa-rsp.proto";

/*
 * GEISA Application Deployment Manifest messages.
 *
 * MQTT topics:
 *   Application Deployment Manifest Request:
 *     geisa/api/app/manifest/req/<userid>
 *   Application Deployment Manifest Response:
 *     geisa/api/app/manifest/rsp/<userid>
 *
 * These messages are separated from discovery.proto so that Platform Discovery
 * remains focused on static or semi-static platform metadata.
 */


/*
 * This is the outermost message for Application Deployment Manifest Request.
 *
 * Message topic:
 *   geisa/api/app/manifest/req/<userid>
 *
 * Empty message for now but may be used in the future.
 */
message GeisaApplicationDeploymentManifest_Req {
}


/*
 * This is the outermost message for Application Deployment Manifest Response.
 *
 * Message topic:
 *   geisa/api/app/manifest/rsp/<userid>
 *
 * The returned manifest is the operator-approved Deployment Application
 * Manifest, serialized as UTF-8 JSON.
 */
message GeisaApplicationDeploymentManifest_Rsp {
  GeisaRsp rsp = 1;

  // UTF-8 JSON serialized operator-approved Deployment Application Manifest
  string manifest = 2;
}

